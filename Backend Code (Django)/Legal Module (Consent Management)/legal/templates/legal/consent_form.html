{% load i18n %}
<!DOCTYPE html>
<html>
<head>
  <title>{% trans "Consent Form" %} - VitalBridge</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
  <div class="max-w-xl mx-auto p-8">
    <h2 class="text-2xl font-bold mb-4 text-center">{% trans "Telemedicine Consent Form" %}</h2>
    <form method="POST">
      {% csrf_token %}
      <div class="mb-4">
        <label class="block mb-2">{% trans "I consent to the telemedicine services provided by VitalBridge." %}</label>
        <input type="checkbox" name="consent" required>
      </div>
      <button type="submit" class="w-full p-2 bg-blue-600 text-white rounded">{% trans "Submit Consent" %}</button>
    </form>
  </div>
</body>
</html>
